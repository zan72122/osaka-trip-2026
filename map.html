<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地図｜大阪旅行 11/14–16</title>
<meta name="description" content="大阪旅行の地図。旅程の地点と寄り道候補を現在地と見比べられます（地図はオンライン専用）。">
<meta name="theme-color" content="#0b4f6c">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  #map{position:fixed;inset:0;background:#e8eef0}
  /* 固定UIは3つまで: アンカー帯(上) / 現在地ボタン / メニューボタン(右下) */
  .band{position:fixed;top:0;left:0;right:0;z-index:1200;background:#0b4f6c;color:#fff;
    font-size:12px;font-weight:700;line-height:1.3;padding:calc(env(safe-area-inset-top) + 4px) 10px 4px;text-align:center;
    box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer;transition:opacity .25s ease}
  .band .line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .band .detail{display:none;font-size:11px;font-weight:400;opacity:.9;white-space:normal;margin-top:2px}
  .band.open .detail{display:block}
  .band.open .line{white-space:normal}
  .ctrls{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:1200;
    display:flex;flex-direction:column;gap:8px;transition:opacity .25s ease}
  .ctrls button{appearance:none;border:0;width:46px;height:46px;border-radius:50%;padding:0;
    font-size:19px;line-height:1;background:rgba(255,255,255,.94);color:#0b4f6c;
    box-shadow:0 1px 5px rgba(0,0,0,.3);cursor:pointer}
  .ctrls button:active{background:#dcebf1}
  #menuPanel{display:none;position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 122px);z-index:1210;
    background:rgba(255,255,255,.97);border-radius:14px;box-shadow:0 3px 14px rgba(0,0,0,.32);
    padding:8px;width:196px;color:#12242c;transition:opacity .25s ease}
  #menuPanel.open{display:block}
  #menuPanel>button{display:block;width:100%;appearance:none;border:0;background:transparent;text-align:left;
    font-size:14px;font-weight:700;color:#0b4f6c;padding:8px 8px;border-radius:8px;cursor:pointer}
  #menuPanel>button:active{background:#eef6f8}
  #menuPanel .mlabel{font-size:11px;font-weight:800;color:#5a6d75;padding:8px 8px 4px;border-top:1px solid #eef2f3;margin-top:4px}
  #menuPanel .mchips{display:flex;flex-wrap:wrap;gap:5px;padding:0 6px 6px}
  #menuPanel .mchips button{appearance:none;border:1px solid rgba(11,79,108,.35);border-radius:999px;
    padding:4px 9px;font-size:12px;font-weight:700;background:#fff;color:#0b4f6c;cursor:pointer}
  #menuPanel .mchips button.on{background:#0b4f6c;color:#fff}
  #menuPanel a.back{display:block;font-size:13px;font-weight:700;color:#0b4f6c;text-decoration:none;
    padding:8px;border-top:1px solid #eef2f3;margin-top:4px}
  .pin{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;background:#0b4f6c}
  .pin.detour{background:#8a97a0}
  .pin.anchor{box-shadow:0 0 0 3px #f2b705,0 1px 5px rgba(0,0,0,.45)}
  .mydot{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.5)}
  .leaflet-popup-content{font-size:14px;line-height:1.5;margin:12px 14px}
  .leaflet-popup-content .nm{font-weight:800;font-size:15px}
  .leaflet-popup-content .memo{color:#333}
  .leaflet-popup-content .tip{color:#5a6d75;font-size:13px}
  .leaflet-popup-content .dist{color:#0b4f6c;font-weight:700;font-size:13px}
  .routebtns{display:flex;gap:6px;margin-top:8px}
  .routebtns button{flex:1;appearance:none;border:1px solid #0b4f6c;border-radius:8px;padding:6px 4px;
    font-size:13px;font-weight:700;background:#eef6f8;color:#0b4f6c;cursor:pointer}
  .routebtns button:active{background:#cfe5ec}
  .routebtns button.set{background:#0b4f6c;color:#fff}
  /* ルートシート: 既定は1行サマリに折り畳み、タップで詳細を展開 */
  #routeSheet{position:fixed;left:0;right:0;bottom:0;z-index:1250;background:#fff;color:#12242c;
    border-radius:16px 16px 0 0;box-shadow:0 -3px 18px rgba(0,0,0,.35);
    transform:translateY(110%);transition:transform .28s ease,opacity .25s ease}
  #routeSheet.open{transform:translateY(0)}
  #routeSummary{display:flex;align-items:center;gap:8px;padding:11px 12px calc(env(safe-area-inset-bottom) + 11px);
    cursor:pointer;min-height:22px}
  #routeSheet.expanded #routeSummary{padding-bottom:6px}
  #routeSummaryText{flex:1;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #routeSummary .chev{font-size:12px;font-weight:700;color:#0b4f6c;flex:0 0 auto}
  #routeClose{flex:0 0 auto;appearance:none;border:0;background:#eef2f3;color:#333;
    width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;padding:0}
  #routeDetail{display:none;max-height:46vh;overflow-y:auto;padding:0 14px calc(env(safe-area-inset-bottom) + 12px)}
  #routeSheet.expanded #routeDetail{display:block}
  #routeDetail .rhead{font-weight:800;font-size:15px;line-height:1.45;margin:2px 0 6px}
  #routeDetail .rrow{display:flex;gap:8px;align-items:baseline;padding:8px 8px;border-top:1px solid #e3ebee;border-radius:8px}
  #routeDetail .rrow.tap{cursor:pointer}
  #routeDetail .rrow.active{background:#eef6f8;outline:1px solid #0b4f6c}
  #routeDetail .rrow .ic{font-size:16px;flex:0 0 auto}
  #routeDetail .rrow .tx{font-size:13.5px;line-height:1.5}
  #routeDetail .rrow .tx b{font-size:14.5px}
  #routeDetail .rrow .est{color:#8a6d00;font-size:12px;font-weight:700}
  #nearPanel{display:none;position:fixed;left:10px;top:calc(env(safe-area-inset-top) + 42px);z-index:1200;
    background:rgba(255,255,255,.96);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.3);
    padding:8px 10px;width:186px;max-width:56vw;color:#12242c;transition:opacity .25s ease}
  #nearPanel .nh{font-size:12px;font-weight:800;color:#0b4f6c;margin-bottom:4px}
  #nearPanel a{display:block;font-size:13px;color:#12242c;text-decoration:none;padding:4px 2px;border-top:1px solid #eef2f3}
  #nearPanel a b{color:#0b4f6c}
  #nearClose{position:absolute;top:4px;right:6px;appearance:none;border:0;background:transparent;font-size:14px;color:#666;cursor:pointer}
  #toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 76px);
    z-index:1260;background:rgba(18,36,44,.92);color:#fff;font-size:13px;font-weight:700;border-radius:999px;
    padding:8px 14px;box-shadow:0 2px 8px rgba(0,0,0,.35);max-width:88vw;text-align:center}
  #fallback{display:none;position:fixed;inset:0;z-index:1300;background:#f4f7f8;color:#12242c;
    padding:80px 24px 24px;text-align:center;font-size:15px;line-height:1.7}
  #fallback a{color:#0b4f6c;font-weight:700}
  #tilenote{display:none;position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:1200;max-width:56vw;
    background:rgba(255,244,214,.96);color:#664d03;font-size:12px;border-radius:10px;padding:8px 10px;box-shadow:0 1px 5px rgba(0,0,0,.25);transition:opacity .25s ease}
  /* 地図を操作している間は固定UI群を半透明にする */
  body.fading .band,body.fading .ctrls,body.fading #menuPanel,
  body.fading #nearPanel,body.fading #routeSheet,body.fading #tilenote{opacity:.35}
</style>
</head>
<body>
<div id="map"></div>

<div class="band" id="anchorBand" title="タップで詳細">
  <div class="line" id="bandLine">⚓ 固定予定：11/14 13:45 海遊館入館 ／ 11/16 12:15 USJ発バス</div>
  <div class="detail" id="bandDetail"></div>
</div>
<div class="ctrls">
  <button id="btnLoc" type="button" title="現在地" aria-label="現在地">📍</button>
  <button id="btnMenu" type="button" title="メニュー" aria-label="メニュー">☰</button>
</div>
<div id="menuPanel">
  <button id="btnAll" type="button">🗺 全体を表示</button>
  <button id="btnDice" type="button">🎲 おまかせ</button>
  <div class="mlabel">🔍 絞り込み（選ぶと閉じます）</div>
  <div class="mchips" id="chips">
    <button type="button" data-f="all" class="on">全部</button>
    <button type="button" data-f="trip">旅程</button>
    <button type="button" data-f="detour">寄り道</button>
    <button type="button" data-f="kids">子どもが喜ぶ</button>
  </div>
  <a class="back" href="./index.html">← 旅行サイトへ戻る</a>
</div>
<div id="tilenote">地図タイルを読み込めませんでした。地図はオンライン専用です。</div>
<div id="nearPanel"><button id="nearClose" type="button" aria-label="閉じる">✕</button><div class="nh">📍 現在地から近い順</div><div id="nearList"></div></div>
<div id="toast"></div>
<div id="routeSheet">
  <div id="routeSummary">
    <span id="routeSummaryText">⏳ 計算中…</span>
    <span class="chev" id="routeChev">詳細 ▸</span>
    <button id="routeClose" type="button" aria-label="ルートを消す">✕</button>
  </div>
  <div id="routeDetail">
    <div class="rhead" id="routeTitle"></div>
    <div id="routeBody"></div>
  </div>
</div>

<div id="fallback">
  <p style="font-size:34px;margin:0">🗺</p>
  <p><b>地図はオンライン専用です。</b><br>地図の読み込みに失敗しました（オフライン等）。<br>本体の情報はオフラインでも読めます。</p>
  <p><a href="./index.html">← 旅行サイトへ戻る</a></p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  "use strict";
  if (typeof L === "undefined") {
    document.getElementById("fallback").style.display = "block";
    return;
  }

  /* ===== 固定アンカー帯（常時は1行、タップで詳細を展開） ===== */
  var ANCHORS = [
    { t: new Date(2026, 10, 14, 13, 45), short: "11/14 13:45 海遊館入館", label: "11/14 13:45 海遊館入館（eチケット購入済み）" },
    { t: new Date(2026, 10, 16, 12, 15), short: "11/16 12:15 USJ発バス", label: "11/16 12:15 USJ発リムジンバス（13:00発が最終の安全圏）" }
  ];
  function fmtRemain(ms) {
    var m = Math.max(0, Math.round(ms / 60000));
    var d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
    if (d > 0) return "あと" + d + "日" + h + "時間";
    if (h > 0) return "あと" + h + "時間" + mm + "分";
    return "あと" + mm + "分";
  }
  function updateBand() {
    var now = new Date(), next = null, nextIdx = -1;
    for (var i = 0; i < ANCHORS.length; i++) { if (now < ANCHORS[i].t) { next = ANCHORS[i]; nextIdx = i; break; } }
    var line = document.getElementById("bandLine"), det = document.getElementById("bandDetail");
    if (next) {
      var remain = fmtRemain(next.t - now);
      line.textContent = "⚓ " + next.short + "（" + remain + "）";
      var d = "次の固定予定：" + next.label + " ／ 残り時間：" + remain + "（目安）";
      if (ANCHORS[nextIdx + 1]) d += "<br>その次：" + ANCHORS[nextIdx + 1].label;
      det.innerHTML = d;
    } else {
      line.textContent = "⚓ 固定予定は全て終了しました";
      det.textContent = "11/14 13:45 海遊館入館 ／ 11/16 12:15 USJ発リムジンバス は終了済みです。";
    }
  }
  updateBand();
  setInterval(updateBand, 60000);
  document.getElementById("anchorBand").addEventListener("click", function () {
    this.classList.toggle("open");
  });

  /* ===== 地点データ（座標: OpenStreetMap Nominatim で取得 2026-11-13） ===== */
  var PLACES = [
    // 旅程
    { lat: 34.7839847, lon: 135.4390407, emoji: "✈️", name: "伊丹空港（大阪国際空港）", detour: false,
      memo: "リムジンバスでUSJまで約40分・大人1,100円（予約不要）。" },
    { lat: 34.6678181, lon: 135.4385746, emoji: "🚉", name: "ユニバーサルシティ駅", detour: false,
      memo: "JRゆめ咲線。大阪駅から約15分。ホテル・USJの最寄り駅。" },
    { lat: 34.6684653, lon: 135.4371821, emoji: "🏨", name: "ホテル近鉄ユニバーサル・シティ", detour: false,
      memo: "USJゲートまで徒歩約1分。チェックイン15:00（荷物預けは先に可）。" },
    { lat: 34.6656393, lon: 135.4324527, emoji: "🎢", name: "ユニバーサル・スタジオ・ジャパン", detour: false,
      memo: "11/15 8:30–22:00。SAIDO（彩道）16:00 優先案内予約済み。" },
    { lat: 34.6651277, lon: 135.4384316, emoji: "⛴️", name: "ユニバーサルシティポート", detour: false,
      memo: "キャプテンラインのりば。海遊館まで片道10分のシャトル船。" },
    { lat: 34.6551600, lon: 135.4293909, emoji: "🐠", name: "海遊館", detour: false, anchor: true,
      memo: "11/14 13:45入館（eチケット購入済み）・再入館不可。ジンベエザメお食事タイム15:00。" },
    { lat: 34.6559737, lon: 135.4303047, emoji: "🛍️", name: "天保山マーケットプレース", detour: false,
      memo: "昼食とお土産はここで入館前に。天保山アニパは3F。",
      tip: "海遊館まで徒歩約3分。13:45入館には13:40頃出ればOK（目安）。" },
    { lat: 34.6561990, lon: 135.4309731, emoji: "🎡", name: "天保山大観覧車", detour: false,
      memo: "1周約15分・海遊館のすぐ隣。土曜は10:00–22:00。",
      tip: "13:45入館には13:30頃までに乗り終わればOK（目安）。" },
    // 寄り道
    { lat: 34.6561606, lon: 135.4304468, emoji: "🧱", name: "レゴランド・ディスカバリー・センター大阪", detour: true,
      memo: "天保山マーケットプレース内の屋内レゴ施設。",
      tip: "滞在1〜2時間（目安）。工作好きの娘に。息子もデュプロで遊べる。13:45入館には13:35頃出ればOK（目安・同施設内から徒歩数分）。" },
    { lat: 34.6871828, lon: 135.5253958, emoji: "🏯", name: "大阪城", detour: true,
      memo: "大阪のシンボル。広い公園と天守閣。",
      tip: "滞在1〜2時間（目安）。家族みんなで散策に。" },
    { lat: 34.7052927, lon: 135.4905349, emoji: "🏙️", name: "梅田スカイビル", detour: true,
      memo: "空中庭園展望台のある超高層ビル。",
      tip: "滞在約1時間（目安）。夕景・夜景は大人が喜ぶ。" },
    { lat: 34.7019048, lon: 135.4944259, emoji: "🚃", name: "大阪駅", detour: true,
      memo: "梅田の中心。JRでユニバーサルシティ駅まで約15分。",
      tip: "滞在30分〜（目安）。駅ビルで買い物・スイーツ（妻向け）。" },
    { lat: 34.6525393, lon: 135.5063098, emoji: "🗼", name: "通天閣", detour: true,
      memo: "新世界のシンボルタワー。",
      tip: "滞在約1時間（目安）。新世界の串カツとセットで。" },
    { lat: 34.6689260, lon: 135.5010546, emoji: "🦀", name: "道頓堀（グリコサイン）", detour: true,
      memo: "グリコサイン前の戎橋。食い倒れの街。",
      tip: "滞在1〜2時間（目安）。たこ焼き・スイーツは妻と娘に。夕方の寄り道に。" },
    { lat: 34.6745173, lon: 135.5003566, emoji: "🏬", name: "心斎橋", detour: true,
      memo: "道頓堀から続くショッピング街。",
      tip: "滞在1〜2時間（目安）。妻のチョコ・スイーツ探しにも。夕方の寄り道に。" },
    { lat: 34.6661565, lon: 135.5002710, emoji: "🚇", name: "なんば駅周辺", detour: true,
      memo: "ミナミの交通ハブ。食事・お土産が集まる。",
      tip: "滞在30分〜1時間（目安）。乗り換えついでの食事・お土産に。" },
    { lat: 34.6457685, lon: 135.5140068, emoji: "🏙️", name: "あべのハルカス", detour: true,
      memo: "高さ300mの超高層ビルと展望台「ハルカス300」。",
      tip: "滞在約1時間（目安）。通天閣と近いのでセットでも。" }
  ];

  var map = L.map("map", { zoomControl: false });
  var tileOk = false;
  var tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "© OpenStreetMap contributors"
  });
  tiles.on("tileload", function () { tileOk = true; });
  tiles.addTo(map);
  setTimeout(function () {
    if (!tileOk) document.getElementById("tilenote").style.display = "block";
  }, 8000);

  // 地図を操作している間は固定UI群を半透明にする
  map.on("movestart zoomstart", function () { document.body.classList.add("fading"); });
  map.on("moveend zoomend", function () { document.body.classList.remove("fading"); });

  // 子どもが喜ぶピン（娘=キラキラ・工作／息子=働く車・昆虫・船 に合うもの）
  var KIDS_MATCH = ["ユニバーサル・スタジオ・ジャパン", "海遊館", "天保山マーケットプレース",
    "天保山大観覧車", "レゴランド", "ユニバーサルシティポート", "大阪城"];
  PLACES.forEach(function (p) {
    p.kids = KIDS_MATCH.some(function (k) { return p.name.indexOf(k) >= 0; });
  });

  var myLatLng = null;
  var routeFrom = null, routeTo = null; // {label, latlng}
  function routeBtnsHTML(key) {
    var f = routeFrom && routeFrom.key === key, t = routeTo && routeTo.key === key;
    return '<div class="routebtns">' +
      '<button type="button" data-rk="' + key + '" data-role="from" class="' + (f ? "set" : "") + '">🚩 ここから</button>' +
      '<button type="button" data-rk="' + key + '" data-role="to" class="' + (t ? "set" : "") + '">🏁 ここへ</button></div>';
  }
  function popupHTML(p) {
    var h = '<div class="nm">' + p.emoji + " " + p.name + "</div>" +
            '<div class="memo">' + p.memo + "</div>";
    if (p.tip) h += '<div class="tip">' + p.tip + "</div>";
    if (myLatLng) {
      var km = myLatLng.distanceTo(L.latLng(p.lat, p.lon)) / 1000;
      h += '<div class="dist">現在地から直線で約 ' + km.toFixed(1) + " km</div>";
    }
    h += routeBtnsHTML(p.name);
    return h;
  }
  var markers = [], detourMarkers = [];
  PLACES.forEach(function (p) {
    var icon = L.divIcon({
      className: "",
      html: '<div class="pin' + (p.detour ? " detour" : "") + (p.anchor ? " anchor" : "") + '">' + p.emoji + "</div>",
      iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -16]
    });
    var m = L.marker([p.lat, p.lon], { icon: icon }).addTo(map);
    m._place = p;
    m.bindPopup(function () { return popupHTML(p); });
    markers.push(m);
    if (p.detour) detourMarkers.push(m);
  });
  function refreshPopups() {
    markers.forEach(function (m) { if (m.getPopup()) m.setPopupContent(popupHTML(m._place)); });
    if (myMarker && myMarker.getPopup()) myMarker.setPopupContent(mePopupHTML());
  }

  // キャプテンライン航路（海遊館側の終点は海遊館の座標で代用）
  var ferry = L.polyline(
    [[34.6651277, 135.4384316], [34.6551600, 135.4293909]],
    { color: "#1a73e8", weight: 3, dashArray: "8 6" }
  ).addTo(map);
  ferry.bindPopup("⛴️ キャプテンライン 片道10分（ユニバーサルシティポート ⇔ 海遊館西はとば）");

  /* ===== メニュー（全体／おまかせ／絞り込み／戻る） ===== */
  var menuPanel = document.getElementById("menuPanel");
  function closeMenu() { menuPanel.classList.remove("open"); }
  document.getElementById("btnMenu").addEventListener("click", function (e) {
    e.stopPropagation();
    menuPanel.classList.toggle("open");
  });
  menuPanel.addEventListener("click", function (e) { e.stopPropagation(); });
  document.addEventListener("click", function () { closeMenu(); });

  var allBounds = L.latLngBounds(PLACES.map(function (p) { return [p.lat, p.lon]; }));
  function showAll() { map.fitBounds(allBounds.pad(0.06)); }
  showAll();
  document.getElementById("btnAll").addEventListener("click", function () { closeMenu(); showAll(); });

  // 🎲 おまかせ（寄り道から完全ランダム）
  document.getElementById("btnDice").addEventListener("click", function () {
    closeMenu();
    var m = detourMarkers[Math.floor(Math.random() * detourMarkers.length)];
    map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 15), { duration: 0.9 });
    map.once("moveend", function () { m.openPopup(); });
  });

  // 現在地
  var myMarker = null, myCircle = null;
  document.getElementById("btnLoc").addEventListener("click", function () {
    if (!navigator.geolocation) { alert("この端末では現在地が使えません"); return; }
    navigator.geolocation.getCurrentPosition(function (pos) {
      var ll = L.latLng(pos.coords.latitude, pos.coords.longitude);
      myLatLng = ll;
      var dot = L.divIcon({ className: "", html: '<div class="mydot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
      if (!myMarker) {
        myMarker = L.marker(ll, { icon: dot, zIndexOffset: 1000 }).addTo(map)
          .bindPopup(function () { return mePopupHTML(); });
        myMarker._isMe = true;
        myCircle = L.circle(ll, { radius: pos.coords.accuracy || 30, color: "#1a73e8", weight: 1, fillOpacity: 0.12 }).addTo(map);
      } else {
        myMarker.setLatLng(ll);
        myCircle.setLatLng(ll);
        myCircle.setRadius(pos.coords.accuracy || 30);
      }
      refreshPopups();
      showNear(ll);
      map.flyTo(ll, Math.max(map.getZoom(), 15), { duration: 0.9 });
    }, function () {
      alert("現在地を取得できませんでした（位置情報の許可を確認してください）");
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  });

  /* ===== カテゴリ絞り込み（メニュー内・選んだら閉じる） ===== */
  document.getElementById("chips").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var f = b.getAttribute("data-f");
    this.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
    markers.forEach(function (m) {
      var p = m._place, show = f === "all" || (f === "trip" && !p.detour) ||
        (f === "detour" && p.detour) || (f === "kids" && p.kids);
      if (show) { if (!map.hasLayer(m)) m.addTo(map); }
      else if (map.hasLayer(m)) map.removeLayer(m);
    });
    closeMenu();
  });

  /* ===== トースト ===== */
  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.style.display = "block";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.display = "none"; }, 2600);
  }

  /* ===== 現在地から近い順リスト（一時表示・左上の小パネル） ===== */
  function showNear(ll) {
    var sorted = markers.map(function (m) {
      return { m: m, km: ll.distanceTo(m.getLatLng()) / 1000 };
    }).sort(function (a, b) { return a.km - b.km; }).slice(0, 3);
    var list = document.getElementById("nearList");
    list.innerHTML = "";
    sorted.forEach(function (s) {
      var a = document.createElement("a");
      a.href = "#";
      a.innerHTML = s.m._place.emoji + " " + s.m._place.name + " <b>約" + s.km.toFixed(1) + "km</b>";
      a.addEventListener("click", function (ev) {
        ev.preventDefault();
        document.getElementById("nearPanel").style.display = "none";
        map.flyTo(s.m.getLatLng(), Math.max(map.getZoom(), 15), { duration: 0.9 });
        map.once("moveend", function () { s.m.openPopup(); });
      });
      list.appendChild(a);
    });
    document.getElementById("nearPanel").style.display = "block";
  }
  document.getElementById("nearClose").addEventListener("click", function () {
    document.getElementById("nearPanel").style.display = "none";
  });

  /* ===== 2地点ルート ===== */
  function mePopupHTML() {
    return '<div class="nm">📍 現在地</div>' + routeBtnsHTML("__me__");
  }
  function pointFor(key) {
    if (key === "__me__") return myLatLng ? { key: key, label: "現在地", latlng: myLatLng } : null;
    for (var i = 0; i < PLACES.length; i++) {
      if (PLACES[i].name === key) {
        return { key: key, label: PLACES[i].emoji + " " + PLACES[i].name, latlng: L.latLng(PLACES[i].lat, PLACES[i].lon) };
      }
    }
    return null;
  }
  map.on("popupopen", function (e) {
    var el = e.popup.getElement(); if (!el) return;
    el.querySelectorAll(".routebtns button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var pt = pointFor(btn.getAttribute("data-rk")); if (!pt) return;
        if (btn.getAttribute("data-role") === "from") routeFrom = pt; else routeTo = pt;
        map.closePopup();
        refreshPopups();
        if (routeFrom && routeTo) {
          if (routeFrom.key === routeTo.key) { toast("同じ地点が選ばれています"); return; }
          openRoute();
        } else {
          toast((btn.getAttribute("data-role") === "from" ? "🚩 出発地" : "🏁 目的地") +
            "に設定：" + pt.label.replace(/^\S+\s/, "") + "（もう1地点選ぶとルート表示）");
        }
      });
    });
  });

  // 既知ペア（サイト検証済みの実情報・双方向）
  function hubTag(p) {
    var n = p.label;
    if (n.indexOf("伊丹空港") >= 0) return "itami";
    if (n.indexOf("ユニバーサルシティポート") >= 0) return "ucport";
    if (n.indexOf("ユニバーサルシティ駅") >= 0) return "ucstation";
    if (n.indexOf("ホテル近鉄") >= 0) return "hotel";
    if (n.indexOf("ユニバーサル・スタジオ") >= 0) return "usj";
    if (n.indexOf("海遊館") >= 0) return "kaiyukan";
    if (n.indexOf("大阪駅") >= 0) return "osakastation";
    if (n.indexOf("なんば") >= 0 || n.indexOf("道頓堀") >= 0 || n.indexOf("心斎橋") >= 0) return "namba";
    return "";
  }
  var KNOWN = [
    { a: ["itami"], b: ["hotel", "usj", "ucstation"], icon: "🚌", short: "40分",
      text: "<b>リムジンバス 約40分</b>・大人1,100円・予約不要（伊丹空港⇔USJ方面）" },
    { a: ["ucport"], b: ["kaiyukan"], icon: "⛴️", short: "船10分",
      text: "<b>キャプテンライン 約10分</b>（船・ユニバーサルシティポート⇔海遊館西はとば）" },
    { a: ["ucstation"], b: ["kaiyukan"], icon: "🚃", short: "25分",
      text: "<b>電車 約25分</b>（JRゆめ咲線→環状線→地下鉄中央線、西九条・弁天町で乗換、海遊館の最寄りは大阪港駅）" },
    { a: ["hotel", "usj", "ucstation"], b: ["namba"], icon: "🚃", short: "30分",
      text: "<b>電車 約30分</b>（USJ方面⇔なんば・道頓堀・心斎橋）" },
    { a: ["kaiyukan"], b: ["namba"], icon: "🚇", short: "20分",
      text: "<b>地下鉄 約20分</b>（中央線・御堂筋線、海遊館⇔なんば・道頓堀）" },
    { a: ["kaiyukan"], b: ["osakastation"], icon: "🚃", short: "30分",
      text: "<b>電車 約30分</b>（海遊館⇔大阪駅・梅田）" }
  ];
  function knownTransit(a, b) {
    var ta = hubTag(a), tb = hubTag(b);
    if (!ta || !tb) return null;
    for (var i = 0; i < KNOWN.length; i++) {
      var k = KNOWN[i];
      if ((k.a.indexOf(ta) >= 0 && k.b.indexOf(tb) >= 0) || (k.a.indexOf(tb) >= 0 && k.b.indexOf(ta) >= 0)) return k;
    }
    return null;
  }

  var footLine = null, carLine = null;
  var sheet = document.getElementById("routeSheet");
  function fmtKm(m) { return (m / 1000).toFixed(1) + " km"; }
  function fmtDur(sec) {
    var m = Math.round(sec / 60);
    if (m < 60) return "約" + m + "分";
    return "約" + Math.floor(m / 60) + "時間" + (m % 60 ? (m % 60) + "分" : "");
  }
  function fmtDurShort(sec) {
    var m = Math.round(sec / 60);
    if (m < 60) return m + "分";
    return Math.floor(m / 60) + "時間" + (m % 60 ? (m % 60) + "分" : "");
  }
  function clearRouteLines() {
    if (footLine) { map.removeLayer(footLine); footLine = null; }
    if (carLine) { map.removeLayer(carLine); carLine = null; }
  }
  function showLine(which) {
    if (footLine) footLine.setStyle({ opacity: which === "foot" ? 0.95 : 0.15 });
    if (carLine) carLine.setStyle({ opacity: which === "car" ? 0.95 : 0.15 });
    if (which === "foot" && footLine) footLine.bringToFront();
    if (which === "car" && carLine) carLine.bringToFront();
    sheet.querySelectorAll(".rrow.tap").forEach(function (r) {
      r.classList.toggle("active", r.getAttribute("data-mode") === which);
    });
  }
  // ルート全体が、現在のシート高さ（折り畳み/展開）とアンカー帯に隠れず見えるようフィット
  function fitRoute() {
    var pts = [];
    if (footLine) pts = pts.concat(footLine.getLatLngs());
    if (carLine) pts = pts.concat(carLine.getLatLngs());
    if (!pts.length && routeFrom && routeTo) pts = [routeFrom.latlng, routeTo.latlng];
    if (!pts.length) return;
    var topPad = document.getElementById("anchorBand").offsetHeight + 10;
    var botPad = (sheet.classList.contains("open") ? sheet.offsetHeight : 0) + 14;
    map.fitBounds(L.latLngBounds(pts).pad(0.04), {
      paddingTopLeft: [10, topPad],
      paddingBottomRight: [10, botPad]
    });
  }
  function osrm(profile, a, b) {
    var url = "https://router.project-osrm.org/route/v1/" + profile + "/" +
      a.latlng.lng + "," + a.latlng.lat + ";" + b.latlng.lng + "," + b.latlng.lat +
      "?overview=full&geometries=geojson";
    return fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || j.code !== "Ok" || !j.routes || !j.routes.length) throw new Error("osrm");
      return j.routes[0];
    });
  }
  function rowHTML(icon, inner, mode) {
    return '<div class="rrow' + (mode ? " tap" : "") + '"' + (mode ? ' data-mode="' + mode + '"' : "") + ">" +
      '<span class="ic">' + icon + '</span><span class="tx">' + inner + "</span></div>";
  }
  function setSummary(txt) {
    document.getElementById("routeSummaryText").textContent = txt;
  }
  function openRoute() {
    var a = routeFrom, b = routeTo;
    clearRouteLines();
    sheet.classList.remove("expanded");
    document.getElementById("routeChev").textContent = "詳細 ▸";
    document.getElementById("routeTitle").innerHTML = a.label + " → " + b.label;
    var body = document.getElementById("routeBody");
    var straight = a.latlng.distanceTo(b.latlng);
    body.innerHTML = "";
    setSummary("⏳ 計算中…");
    sheet.classList.add("open");

    var known = knownTransit(a, b);
    var transitRow, transitShort;
    if (known) {
      transitRow = rowHTML(known.icon, known.text + "（検証済みの実情報）");
      transitShort = known.icon + " " + known.short;
    } else {
      var estMin = Math.round((straight / 1000) / 15 * 60 + 15);
      transitRow = rowHTML("🚃", "<b>電車・バス " + fmtDur(estMin * 60) + "</b>（直線距離からの粗い推定） <span class='est'>目安</span>");
      transitShort = "🚃 " + estMin + "分";
    }

    var footDone = osrm("foot", a, b).then(function (r) {
      footLine = L.polyline(r.geometry.coordinates.map(function (c) { return [c[1], c[0]]; }),
        { color: "#2e7d32", weight: 5, opacity: 0.95 }).addTo(map);
      // OSRM foot の所要時間は実勢と合わないことがあるため、距離から徒歩速度4.2km/hで換算する
      var sec = r.distance / 1000 / 4.2 * 3600;
      return { row: rowHTML("🚶", "<b>徒歩 " + fmtDur(sec) + "</b>・" + fmtKm(r.distance) + "（道なり）", "foot"),
               sum: "🚶 " + fmtDurShort(sec) };
    }).catch(function () {
      var d = straight * 1.3;
      var sec = d / 1000 / 4.2 * 3600;
      return { row: rowHTML("🚶", "<b>徒歩 " + fmtDur(sec) + "</b>・約" + fmtKm(d) + "（直線からの推定） <span class='est'>推定</span>", "foot"),
               sum: "🚶 " + fmtDurShort(sec) };
    });
    var carDone = osrm("driving", a, b).then(function (r) {
      carLine = L.polyline(r.geometry.coordinates.map(function (c) { return [c[1], c[0]]; }),
        { color: "#e67e22", weight: 5, opacity: 0.95 }).addTo(map);
      var fare = Math.round((680 + 415 * (r.distance / 1000)) / 10) * 10;
      return { row: rowHTML("🚕", "<b>車・タクシー " + fmtDur(r.duration) + "</b>・" + fmtKm(r.distance) +
                 "（道なり）／タクシー料金 約" + fare.toLocaleString() + "円 <span class='est'>目安</span>", "car"),
               sum: "🚕 " + fmtDurShort(r.duration) };
    }).catch(function () {
      var d = straight * 1.35;
      var fare = Math.round((680 + 415 * (d / 1000)) / 10) * 10;
      var sec = d / 1000 / 25 * 3600;
      return { row: rowHTML("🚕", "<b>車・タクシー " + fmtDur(sec) + "</b>・約" + fmtKm(d) +
                 "（直線からの推定）／タクシー料金 約" + fare.toLocaleString() + "円 <span class='est'>推定・目安</span>", "car"),
               sum: "🚕 " + fmtDurShort(sec) };
    });

    Promise.all([footDone, carDone]).then(function (res) {
      body.innerHTML = rowHTML("📏", "直線距離 <b>" + fmtKm(straight) + "</b>") + res[0].row + res[1].row + transitRow +
        '<div class="rrow"><span class="ic">💡</span><span class="tx" style="font-size:12px;color:#5a6d75">徒歩（緑）／車（オレンジ）の行をタップすると、そのルート線だけ濃く表示します</span></div>';
      setSummary(res[0].sum + " ｜ " + res[1].sum + " ｜ " + transitShort);
      body.querySelectorAll(".rrow.tap").forEach(function (r) {
        r.addEventListener("click", function () { showLine(r.getAttribute("data-mode")); });
      });
      fitRoute();
      showLine("foot");
    });
  }
  // サマリ行タップで詳細を開閉（開閉したら線が隠れないよう再フィット）
  document.getElementById("routeSummary").addEventListener("click", function (e) {
    if (e.target.closest("#routeClose")) return;
    var open = sheet.classList.toggle("expanded");
    document.getElementById("routeChev").textContent = open ? "閉じる ▾" : "詳細 ▸";
    setTimeout(fitRoute, 60);
  });
  document.getElementById("routeClose").addEventListener("click", function () {
    sheet.classList.remove("open");
    sheet.classList.remove("expanded");
    document.getElementById("routeChev").textContent = "詳細 ▸";
    clearRouteLines();
    routeFrom = null; routeTo = null;
    refreshPopups();
  });

  // ===== URLパラメータで2地点ルートを自動表示（ map.html?a=<ピン名>&b=<ピン名> ） =====
  // 照合順：ピンの name と完全一致 → 略称 → 前方一致（1件のみ） → 部分一致（1件のみ）。
  // どちらか一方でも解決できない・同じ地点の場合は何もせず通常表示のままにする。
  function resolvePinParam(q) {
    if (!q) return null;
    q = String(q).trim();
    if (!q) return null;
    var pt = pointFor(q);
    if (pt) return pt;
    var ALIAS = { "USJ": "ユニバーサル・スタジオ・ジャパン" };
    if (ALIAS[q]) { pt = pointFor(ALIAS[q]); if (pt) return pt; }
    var i, cand = [];
    for (i = 0; i < PLACES.length; i++) { if (PLACES[i].name.indexOf(q) === 0) cand.push(PLACES[i]); }
    if (cand.length === 1) return pointFor(cand[0].name);
    cand = [];
    for (i = 0; i < PLACES.length; i++) { if (PLACES[i].name.indexOf(q) >= 0) cand.push(PLACES[i]); }
    if (cand.length === 1) return pointFor(cand[0].name);
    return null;
  }
  (function () {
    var params;
    try { params = new URLSearchParams(location.search); } catch (e) { return; }
    var pa = resolvePinParam(params.get("a"));
    var pb = resolvePinParam(params.get("b"));
    if (!pa || !pb || pa.key === pb.key) return;
    routeFrom = pa; routeTo = pb;
    refreshPopups();
    if (document.readyState === "complete") openRoute();
    else window.addEventListener("load", function () { openRoute(); });
  })();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js").catch(function () {}); });
  }
})();
</script>
</body>
</html>
